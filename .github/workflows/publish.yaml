name: Publish Release & Package

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build with Maven
        run: mvn -B package --file pom.xml
